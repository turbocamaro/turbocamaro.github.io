<script>
  (function() {
    // We use a small delay to ensure the theme has finished its work
    setTimeout(function() {
      let currentTitle = document.title;
      if (currentTitle.includes(" | ")) {
        let parts = currentTitle.split(" | ");
        // This flips [Site] | [Page] to [Page] | [Site]
        document.title = parts[1].trim() + " | " + parts[0].trim();
      }
    }, 100);
  })();
</script>
