<script>
  (function() {
    let currentTitle = document.title;
    if (currentTitle.includes(" | ")) {
      let parts = currentTitle.split(" | ");
      // This flips the parts: [Site] | [Page] becomes [Page] | [Site]
      document.title = parts[1] + " | " + parts[0];
    }
  })();
</script>
