<script>
  (function() {
    function overrideTabTitles() {
      const brand = "Turbo Camaro";
      const path = window.location.pathname;
      let tabName = "";

      // We look at the URL to decide the Tab Title
      if (path.includes("/about/")) tabName = "About the Build";
      else if (path.includes("/archives/")) tabName = "Timeline";
      else if (path.includes("/categories/")) tabName = "Build Sheet";

      if (tabName !== "") {
        document.title = tabName + " | " + brand;
      }
    }

    // This "Observer" watches for the theme trying to break the title
    const observer = new MutationObserver(overrideTabTitles);
    if (document.querySelector('title')) {
      observer.observe(document.querySelector('title'), { childList: true });
    }
    
    // Run it once on load
    overrideTabTitles();
  })();
</script>
