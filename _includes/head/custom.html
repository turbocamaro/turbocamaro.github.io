<script>
(function() {
  function fixTurboTitle() {
    const path = window.location.pathname;
    const brand = "Turbo Camaro";
    let pageName = "";

    // Mapping URLs to your desired Page Names
    if (path.includes("/about/")) pageName = "About the Build";
    else if (path.includes("/archives/")) pageName = "Timeline";
    else if (path.includes("/categories/")) pageName = "Build Sheet";
    
    // If we found a match, force the "[Page] | [Brand]" format
    if (pageName !== "") {
      const finalTitle = pageName + " | " + brand;
      if (document.title !== finalTitle) {
        document.title = finalTitle;
      }
    }
  }

  // 1. Run immediately on load
  fixTurboTitle();

  // 2. Watch for the theme trying to change it back (The "Observer")
  const observer = new MutationObserver(fixTurboTitle);
  observer.observe(document.querySelector('title'), { childList: true });

  // 3. Hook into Chirpy's internal page-swap event
  window.addEventListener('view.done', fixTurboTitle);
})();
</script>
