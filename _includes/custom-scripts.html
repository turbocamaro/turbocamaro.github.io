<script>
/* TurboCamaro Launch Logic - Force Injection */
(function() {
  const initLaunch = () => {
    const track = document.getElementById('racetrack');
    const container = document.getElementById('launch-container');

    if (container && track) {
      container.addEventListener('click', function() {
        if (!track.classList.contains('is-launching')) {
          track.classList.add('is-launching');
          setTimeout(() => {
            track.classList.remove('is-launching');
          }, 1500);
        }
      });
    }
  };

  // Run on initial load and handle Chirpy's PWA page transitions
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initLaunch);
  } else {
    initLaunch();
  }
})();
</script>
