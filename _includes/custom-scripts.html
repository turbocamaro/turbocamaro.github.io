<script>
  function launchBurnout() {
    const track = document.getElementById('racetrack');
    if (track && !track.classList.contains('is-launching')) {
      track.classList.add('is-launching');
      
      // Keep at high speed for 1.5 seconds
      setTimeout(() => {
        track.classList.remove('is-launching');
      }, 1500);
    }
  }

  // Fallback: If the 'onclick' attribute is stripped from the HTML, 
  // this will manually attach the listener once the page loads.
  document.addEventListener('DOMContentLoaded', function() {
    const container = document.getElementById('launch-container');
    if (container) {
      container.addEventListener('click', launchBurnout);
    }
  });
</script>
